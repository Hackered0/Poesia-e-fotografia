<script>
    function mostrarMensagem(){
        //Lista de todos os anos que estão nas opções
        let lista_anos = [1940, 1941, 1942, 1943, 1944, 1945, 1946, 1947, 1948, 1949, 1950, 1951, 1952, 1953, 1954, 1955, 1956, 1957, 1958, 1959, 1960, 1961, 1962, 1963, 1964, 1965, 1966, 1967, 1968, 1969, 1970, 1971, 1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979, 1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];

        //Estações que estão nas opções
        let lista_estacoes = [`Primavera`,`Verão`,`Outono `,`Inverno`];

        //Lista dos estilos das fotografias
        let analogica = "Analógica";
        let pretoEBranco = "Preto e Branco";
        let macro = "Macro";
        let retrato = "Retrato";
        let paisagem = "Paisagem";
        let cyberpunk = "Cyberpunk";
        let vintage = "Vintage";
        let minimalista = "Minimalista";
        let streetPhotography = "Street Photography";
        let longaExposicao = "Longa Exposição";
        let documental = "Documental";
        let moda = "Moda";
        let surrealista = "Surrealista";
        let arquitetura = "Arquitetura";
        let gastronomica = "Gastronomica";
        let fineArt = "Fine Art";
        let subaquatica = "Subaquática";
        let astrofotografia = "Astrofotografia";
        let infravermelho = "Infravermelho";
        let gotica = "Gotica";

        //Todos os caracters especiais para validação
        let vetor = ['!','@','#','$','%','¨','&','*','(',')','-','+','=','{','}'];

        //Poesias
        let lista_poesia = [
        ` Memória<br>
        <br>
        Amar o perdido<br>
        deixa confundido<br>
        este coração.<br>
        <br>
        Nada pode o olvido<br>
        contra o sem sentido<br>
        apelo do Não.<br>
        <br>
        As coisas tangíveis<br>
        tornam-se insensíveis<br>
        à palma da mão<br>
        <br>
        Mas as coisas findas<br>
        muito mais que lindas,<br>
        essas ficarão.Carlos Drummond de Andrade<br>
        `,
        `As sem-razões do amor<br>
        <br>
        Eu te amo porque te amo,<br>
        Não precisas ser amante,<br>
        e nem sempre sabes sê-lo.<br>
        Eu te amo porque te amo.<br>
        Amor é estado de graça<br>
        e com amor não se paga.<br>
        <br>
        Amor é dado de graça,<br>
        é semeado no vento,<br>
        na cachoeira, no eclipse.<br>
        Amor foge a dicionários<br>
        e a regulamentos vários.<br>
        <br>
        Eu te amo porque não amo<br>
        bastante ou demais a mim.<br>
        Porque amor não se troca,<br>
        não se conjuga nem se ama.<br>
        Porque amor é amor a nada,<br>
        feliz e forte em si mesmo.<br>
        <br>
        Amor é primo da morte,<br>
        e da morte vencedor,<br>
        por mais que o matem (e matam)<br>
        a cada instante de amor.Carlos Drummond de Andrade<br>
        `,
        `A Felicidade<br>
        <br>
        Tristeza não tem fim<br>
        Felicidade sim<br>
        <br>
        A felicidade é como a pluma<br>
        Que o vento vai levando pelo ar<br>
        Voa tão leve<br>
        Mas tem a vida breve<br>
        Precisa que haja vento sem parar<br>
        <br>
        A felicidade do pobre parece<br>
        A grande ilusão do carnaval<br>
        A gente trabalha o ano inteiro<br>
        Por um momento de sonho<br>
        Pra fazer a fantasia<br>
        De rei ou de pirata ou jardineira<br>
        Pra tudo se acabar na quarta-feira<br>
        <br>
        Tristeza não tem fim<br>
        Felicidade sim<br>
        <br>
        A felicidade é como a gota<br>
        De orvalho numa pétala de flor<br>
        Brilha tranqüila<br>
        Depois de leve oscila<br>
        E cai como uma lágrima de amor<br>
        <br>
        A felicidade é uma coisa boa<br>
        E tão delicada também<br>
        Tem flores e amores<br>
        De todas as cores<br>
        Tem ninhos de passarinhos<br>
        Tudo de bom ela tem<br>
        E é por ela ser assim tão delicada<br>
        Que eu trato dela sempre muito bem<br>
        Vinicius de Moraes<br>
        `
        ];

        let primeiro_nome = ipt_primeiro_nome.value;
        let ano_nascimento = Number (sel_ano_nascimento.value);
        let estacao_do_ano = sel_estacao_do_ano.value;
        let fotografia = sel_fotografia.value;
        div_mensagem.innerHTML = '';
        
        // Validação com REPETIÇÃO
        let nome_valido = true;
        for (let i = 0; i < vetor.length; i++) {
            if (primeiro_nome.includes(vetor[i])) {
                nome_valido = false;
                break;
            }
        }

        if (!nome_valido) {
            div_mensagem.innerHTML = `<span style="color: brown;">Digite um nome válido</span>`;
        } else if (primeiro_nome == '' || ano_nascimento == 'opcao' || estacao_do_ano == 'opcao' || fotografia == 'opcao'){
            div_mensagem.innerHTML = `<span style="color: brown;">Preencha todos os campos corretamente</span>`;
        } else {
        
            // ===== CÁLCULOS MATEMÁTICOS (Arq. Computadores e Matemática) =====
            let ano_atual = 2026;
            let idade = ano_atual - ano_nascimento; // SUBTRAÇÃO

            // NOVAS PONTUAÇÕES DEFINIDAS PELO USUÁRIO
            let valor_estacao = 0;
            if(estacao_do_ano == 'Primavera') valor_estacao = 40; // Romance
            else if(estacao_do_ano == 'Verão') valor_estacao = 30; // Alegre/Agitado
            else if(estacao_do_ano == 'Outono') valor_estacao = 45; // Calmo/Sereno
            else if(estacao_do_ano == 'Inverno') valor_estacao = 50; // Melancólico/Frio

            // CÁLCULO COM FRAÇÃO, MULTIPLICAÇÃO E RAIZ QUADRADA
            let numerador = idade * valor_estacao;        // MULTIPLICAÇÃO
            let denominador = 10;                          // FRAÇÃO
            let resultado_fracao = numerador / denominador; 
            let indice_poetico = Math.sqrt(resultado_fracao); // RAIZ QUADRADA

            // Poesia aleatória
            let poesia_aleatoria = Math.random() * lista_poesia.length;
            let contador = 0;
            while (poesia_aleatoria >= 1) {
                poesia_aleatoria = poesia_aleatoria - 1;
                contador = contador + 1;
            }
            let poesia_aleatoria_certo = lista_poesia[contador];
            
            // Mensagem inicial baseada na idade
            div_mensagem.innerHTML += `<br>Olá ${(primeiro_nome)}, você tem ${idade} anos. 
            <br>Sua alma carrega o peso e a leveza do tempo. 
            <br>Sua poesia sorteada é:<br><br><span>${(poesia_aleatoria_certo)}</span><br><br>`;
            
            // IF/ELSE DAS ESTAÇÕES COM AS NOVAS PONTUAÇÕES E MENSAGENS PROFUNDAS
            if(estacao_do_ano == 'Primavera'){
                let msg = `<br><b>PRIMAVERA - O Desabrochar Romântico (Peso: 40)</b><br><br>`;
                if(indice_poetico < 8) {
                    msg += `Seu romance é como um botão que ainda hesita em abrir. Você sente a doçura da vida, mas a protege com cuidado.`;
                } else {
                    msg += `Você é um romântico incurável. Sua alma busca renovação em cada olhar, transformando o mundo em um jardim de possibilidades infinitas.`;
                }
                msg += `<br><br><i>Legenda: Seu Índice Poético de ${indice_poetico.toFixed(2)} reflete sua conexão com o romance.</i>`;
                div_mensagem.innerHTML += msg;

            } else if(estacao_do_ano == 'Verão'){
                let msg = `<br><b>VERÃO - A Explosão de Vida (Peso: 30)</b><br><br>`;
                if(indice_poetico < 8) {
                    msg += `Sua alegria é um sol de fim de tarde, suave e reconfortante. Você prefere o brilho que não queima.`;
                } else {
                    msg += `Você é pura energia solar. Sua agitação é criativa e sua alegria é o combustível que ilumina os dias mais escuros ao seu redor.`;
                }
                msg += `<br><br><i>Legenda: Seu Índice Poético de ${indice_poetico.toFixed(2)} mede sua vibração vital.</i>`;
                div_mensagem.innerHTML += msg;

            } else if(estacao_do_ano == 'Outono'){
                let msg = `<br><b>OUTONO - A Serenidade da Alma (Peso: 45)</b><br><br>`;
                if(indice_poetico < 10) {
                    msg += `Sua calma é um refúgio. Você entende que para crescer, às vezes é preciso deixar as folhas caírem em silêncio.`;
                } else {
                    msg += `Você possui uma serenidade profunda, quase mística. Sua alma é um bosque dourado onde o tempo parece parar para ouvir seus pensamentos.`;
                }
                msg += `<br><br><i>Legenda: Seu Índice Poético de ${indice_poetico.toFixed(2)} mostra sua alta afinidade com a introspecção serena.</i>`;
                div_mensagem.innerHTML += msg;

            } else if(estacao_do_ano == 'Inverno'){
                let msg = `<br><b>INVERNO - A Melancolia Poética (Peso: 50)</b><br><br>`;
                if(indice_poetico < 12) {
                    msg += `Sua melancolia é um manto de neve fino, que traz silêncio e reflexão sem congelar a esperança.`;
                } else {
                    msg += `Você é o verdadeiro poeta melancólico. Encontra no frio e no isolamento a matéria-prima para as mais profundas emoções. Sua alma é um lago profundo que só revela sua beleza para quem não teme o silêncio.`;
                }
                msg += `<br><br><i>Legenda: Seu Índice Poético de ${indice_poetico.toFixed(2)} é o mais alto, pois a melancolia é a raiz da grande poesia.</i>`;
                div_mensagem.innerHTML += msg;
            }

            // Estilo de Fotografia
            div_mensagem.innerHTML += `<br><br>Seu estilo favorito é <b>${fotografia}</b>, o que revela ainda mais sobre sua visão de mundo.`;
        }
    }
