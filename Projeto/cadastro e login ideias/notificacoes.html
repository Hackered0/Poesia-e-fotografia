<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lírion | Notificações</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #121214;
            color: #c4c4c4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .alerta-container {
            text-align: center;
            padding: 40px;
            border: 1px solid #333;
            background-color: #0D0D0D;
            box-shadow: 0px 20px 50px rgba(0,0,0,0.8);
            max-width: 500px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            color: #BFBFBF;
            margin-bottom: 30px;
        }

    
        .botao-voltar {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #ff0000;
            color: #ff0000;
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
        }

        .botao-voltar:hover {
            background-color: #ff0000;
            color: #ffffff;
        }

    
    </style>
</head>
<body>

    <div class="alerta-container">
        <h1>Inscrição Concluída</h1>
        <p>Você agora faz parte da nossa lista. Notificações sobre novos autores e conteúdos sombrios serão enviadas diretamente para você.</p>
        
        <a href="Index.html" class="botao-voltar">Voltar ao Início</a>
    </div>

</body>
</html>
